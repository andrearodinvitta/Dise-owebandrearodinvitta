<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" fill="none">
  <defs>
    <radialGradient id="discoShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="silverChain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="discoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Hanging String / Chain -->
  <line x1="60" y1="0" x2="60" y2="40" stroke="url(#silverChain)" stroke-width="2" stroke-dasharray="2,2"/>
  <circle cx="60" cy="40" r="4" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
  <!-- Mirror Ball Sphere -->
  <g transform="translate(0, 10)">
    <circle cx="60" cy="80" r="45" fill="url(#discoShine)" stroke="#334155" stroke-width="1.5" filter="url(#discoGlow)"/>
    <!-- Mirror facets grid -->
    <ellipse cx="60" cy="80" rx="45" ry="12" stroke="#FFFFFF" stroke-width="0.75" opacity="0.6" fill="none"/>
    <ellipse cx="60" cy="65" rx="42" ry="10" stroke="#FFFFFF" stroke-width="0.75" opacity="0.5" fill="none"/>
    <ellipse cx="60" cy="95" rx="42" ry="10" stroke="#FFFFFF" stroke-width="0.75" opacity="0.5" fill="none"/>
    <ellipse cx="60" cy="50" rx="33" ry="8" stroke="#FFFFFF" stroke-width="0.75" opacity="0.4" fill="none"/>
    <ellipse cx="60" cy="110" rx="33" ry="8" stroke="#FFFFFF" stroke-width="0.75" opacity="0.4" fill="none"/>
    <!-- Vertical meridian slices -->
    <line x1="60" y1="35" x2="60" y2="125" stroke="#FFFFFF" stroke-width="0.75" opacity="0.5"/>
    <line x1="42" y1="38" x2="42" y2="122" stroke="#FFFFFF" stroke-width="0.75" opacity="0.4"/>
    <line x1="78" y1="38" x2="78" y2="122" stroke="#FFFFFF" stroke-width="0.4"/>
    <line x1="28" y1="46" x2="28" y2="114" stroke="#FFFFFF" stroke-width="0.75" opacity="0.3"/>
    <line x1="92" y1="46" x2="92" y2="114" stroke="#FFFFFF" stroke-width="0.75" opacity="0.3"/>
    <!-- Sparkles / Flash gleams -->
    <path d="M45 55 L48 60 L53 62 L48 64 L45 69 L42 64 L37 62 L42 60 Z" fill="#FFFFFF" filter="url(#discoGlow)"/>
    <path d="M78 85 L80 88 L83 89 L80 90 L78 93 L76 90 L73 89 L76 88 Z" fill="#FFE898" filter="url(#discoGlow)"/>
    <path d="M35 95 L37 98 L40 99 L37 100 L35 103 L33 100 L30 99 L33 98 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
