<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Main Crown Arch & Peaks -->
  <path d="M20 62 L32 28 L54 46 L80 14 L106 46 L128 28 L140 62 Z" fill="url(#goldGrad)" opacity="0.95" stroke="#FDF0CD" stroke-width="1.2"/>
  <!-- Highlight facet overlay -->
  <path d="M80 14 L106 46 L80 62 L54 46 Z" fill="url(#goldShine)" opacity="0.3"/>
  <!-- Base headband band -->
  <rect x="18" y="60" width="124" height="8" rx="4" fill="url(#goldGrad)" stroke="#FFE898" stroke-width="0.8"/>
  <line x1="22" y1="64" x2="138" y2="64" stroke="#FFF7D6" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Crown Jewels / Orbs at peaks -->
  <circle cx="80" cy="14" r="5" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="32" cy="28" r="3.5" fill="#FFE898" stroke="#D4AF37" stroke-width="1.2"/>
  <circle cx="128" cy="28" r="3.5" fill="#FFE898" stroke="#D4AF37" stroke-width="1.2"/>
  <circle cx="54" cy="46" r="3" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1"/>
  <circle cx="106" cy="46" r="3" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1"/>
  <!-- Intricate filigree cutout arcs inside crown -->
  <path d="M42 60 C50 44, 62 44, 68 60" stroke="#FAF8F5" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M92 60 C98 44, 110 44, 118 60" stroke="#FAF8F5" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Center marquise gem -->
  <path d="M80 36 C73 46, 73 52, 80 58 C87 52, 87 46, 80 36 Z" fill="#FFFFFF" opacity="0.95" stroke="#D4AF37" stroke-width="1" filter="url(#glow)"/>
</svg>
