<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Autumn botanical watercolor branch illustration with eucalyptus, dry roses, autumn leaves -->
  <g opacity="0.9">
    <!-- Main branch -->
    <path d="M 10 190 Q 90 150 160 110 T 280 30" stroke="#8C6747" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 110 135 Q 160 140 220 170" stroke="#8C6747" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 160 110 Q 180 70 230 50" stroke="#8C6747" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Eucalyptus leaves (soft sage/eucalyptus green) -->
    <ellipse cx="60" cy="170" rx="16" ry="10" transform="rotate(-30 60 170)" fill="#78866B" opacity="0.75"/>
    <ellipse cx="95" cy="140" rx="18" ry="11" transform="rotate(-40 95 140)" fill="#8A9A7B" opacity="0.8"/>
    <ellipse cx="130" cy="115" rx="17" ry="10" transform="rotate(-25 130 115)" fill="#6B785D" opacity="0.7"/>
    <ellipse cx="190" cy="80" rx="15" ry="9" transform="rotate(-35 190 80)" fill="#78866B" opacity="0.75"/>
    <ellipse cx="250" cy="45" rx="13" ry="8" transform="rotate(-20 250 45)" fill="#8A9A7B" opacity="0.8"/>

    <!-- Autumn Ochre/Gold & Terracotta leaves -->
    <path d="M 120 120 C 140 90 170 100 160 130 C 145 135 125 135 120 120 Z" fill="#D49B4B" opacity="0.75"/>
    <path d="M 180 150 C 210 130 230 155 210 175 C 190 175 175 160 180 150 Z" fill="#B15E3B" opacity="0.7"/>
    <path d="M 210 65 C 235 45 255 70 235 85 C 215 85 205 75 210 65 Z" fill="#C9A876" opacity="0.8"/>
    
    <!-- Dusty Rose Watercolor Blossom -->
    <circle cx="160" cy="105" r="14" fill="#D98A7A" opacity="0.7"/>
    <circle cx="156" cy="102" r="10" fill="#E8A598" opacity="0.85"/>
    <circle cx="163" cy="107" r="8" fill="#C26D5C" opacity="0.6"/>
    <circle cx="158" cy="104" r="4" fill="#8C4334" opacity="0.9"/>
    
    <circle cx="225" cy="165" r="11" fill="#D98A7A" opacity="0.75"/>
    <circle cx="222" cy="163" r="7" fill="#E8A598" opacity="0.85"/>
    <circle cx="224" cy="164" r="3" fill="#8C4334" opacity="0.9"/>

    <!-- Small berries/accents -->
    <circle cx="100" cy="120" r="3.5" fill="#8C4334"/>
    <circle cx="108" cy="115" r="3" fill="#B15E3B"/>
    <circle cx="175" cy="70" r="3.5" fill="#C9A876"/>
    <circle cx="205" cy="50" r="3" fill="#8C4334"/>
  </g>
</svg>